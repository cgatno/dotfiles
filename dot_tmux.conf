# ============================================================
# tmux configuration
# ============================================================

# ---------- Core behavior ----------

# Change prefix from Ctrl+b to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse mode (scroll, click to focus pane, drag to resize)
set -g mouse on

# Start window/pane numbering at 1 (0 is too far from home row)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Fix Esc delay for nvim responsiveness (default 500ms is too slow)
set -sg escape-time 10

# Increase scrollback history
set -g history-limit 50000

# ---------- Display ----------

# Use 256-color + truecolor (essential for Gruvbox to render correctly)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# Focus events for nvim autoread
set -g focus-events on

# ---------- Keybindings ----------

# More intuitive split bindings: | for vertical, - for horizontal
# (and keep current directory when splitting)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Quick config reload
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ---------- Plugins ----------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Persistence — save/restore sessions, automatically
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Pane navigation that works across tmux and nvim with Ctrl+h/j/k/l
set -g @plugin 'christoomey/vim-tmux-navigator'

# Gruvbox theme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# tmux-continuum settings
set -g @continuum-restore 'on'       # auto-restore on tmux server start
set -g @continuum-save-interval '15' # save every 15 minutes

# tmux-resurrect: also save/restore running programs (nvim, etc.)
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

